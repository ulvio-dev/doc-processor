<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc Processor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23111827' d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.5L18.5 9zM8 13h8v2H8zm0 4h8v2H8z'/%3E%3C/svg%3E">

  <!-- No build step, by design: everything is a CDN script plus plain JSX
       compiled in the browser by Babel standalone. Same approach as
       ulvio-dev/roof-measurement. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900 antialiased">
  <div id="root"></div>

  <noscript>
    <p style="padding:2rem;font-family:system-ui">
      This page needs JavaScript. The service itself does not — see
      <code>GET /api/contract</code> for the HTTP contract.
    </p>
  </noscript>

  <script type="text/babel" data-presets="env,react" src="/ui/components/util.js"></script>
  <script type="text/babel" data-presets="env,react" src="/ui/components/Icon.js"></script>
  <script type="text/babel" data-presets="env,react" src="/ui/components/Button.js"></script>
  <script type="text/babel" data-presets="env,react" src="/ui/components/Card.js"></script>
  <script type="text/babel" data-presets="env,react" src="/ui/components/Field.js"></script>
  <script type="text/babel" data-presets="env,react" src="/ui/components/StatusBar.js"></script>
  <script type="text/babel" data-presets="env,react" src="/ui/components/ContractCard.js"></script>
  <script type="text/babel" data-presets="env,react" src="/ui/components/UploadCard.js"></script>
  <script type="text/babel" data-presets="env,react" src="/ui/components/RunCard.js"></script>
  <script type="text/babel" data-presets="env,react" src="/ui/components/ResultCard.js"></script>
  <script type="text/babel" data-presets="env,react" src="/ui/components/QueueCard.js"></script>
  <script type="text/babel" data-presets="env,react" src="/ui/components/App.js"></script>
  <script type="text/babel" data-presets="env,react">
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

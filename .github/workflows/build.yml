# Manual builds only.
#
# There is deliberately no push/PR/tag trigger: images are cut when someone
# decides to cut one, not on every commit. Run it from the Actions tab or with
#   gh workflow run build.yml -f tag=1.2.3
name: Build image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (blank = short commit SHA)'
        required: false
        type: string
      latest:
        description: 'Also push :latest'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(git rev-parse --short HEAD)"; fi
          TAGS="$IMAGE:$TAG"
          if [ "${{ inputs.latest }}" = "true" ]; then TAGS="$TAGS,$IMAGE:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Building $TAGS"

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is enough for GHCR — no registry secrets to manage.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # x86 only. The runtime is amd64 CPU nodes; an arm64 build would
          # double the build time for nothing.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
